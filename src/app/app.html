<app-capcalera />

<h2>El meu catàleg</h2>

@for (producte of productes; track producte.id; let i = $index) {
  <div class="producte">
    <p>{{ i + 1 }}. {{ producte.nom }}</p>

    <app-tarjeta
      [producte]="producte"
      (producteSeleccionat)="seleccionarProducte($event)"
    />
  </div>
} @empty {
  <p>No hi ha productes per mostrar.</p>
}

@if (producteSeleccionat) {
  <p>Has seleccionat: {{ producteSeleccionat.nom }}</p>
}

<app-info />
